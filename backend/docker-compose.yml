services:
  postgres:
    image: postgres:16-alpine
    container_name: learnafricalite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: learnafricalite
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - learnafricalite-pgdata:/var/lib/postgresql/data

volumes:
  learnafricalite-pgdata:
